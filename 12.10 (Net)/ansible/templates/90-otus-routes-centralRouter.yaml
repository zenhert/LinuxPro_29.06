network:
  version: 2
  ethernets:
    eth0:
      dhcp4: true
      dhcp4-overrides:
        use-routes: false
      dhcp6: false
    eth1:
      routes:
        - to: 0.0.0.0/0
          via: 192.168.255.1
    eth5:
      routes:
        - to: 192.168.2.0/24
          via: 192.168.255.10
    eth6:
      routes:
        - to: 192.168.1.0/24
          via: 192.168.255.6
