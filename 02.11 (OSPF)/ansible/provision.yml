---
- name: Setup OSPF routers
  hosts: all
  become: yes
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Disable ufw
      systemd:
        name: ufw
        state: stopped
        enabled: false

    - name: Install base tools
      apt:
        name:
          - vim
          - traceroute
          - tcpdump
          - net-tools
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add GPG key for FRR
      shell: |
        curl -s https://deb.frrouting.org/frr/keys.asc | gpg --dearmor > /usr/share/keyrings/frr.gpg
      args:
        creates: /usr/share/keyrings/frr.gpg

    - name: Add FRR repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/frr.gpg] https://deb.frrouting.org/frr {{ ansible_distribution_release }} frr-stable"
        state: present

    - name: Install FRR packages
      apt:
        name:
          - frr
          - frr-pythontools
        state: present
        update_cache: true

    - name: Enable IP forwarding
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.forwarding
        value: '1'
        state: present
        sysctl_set: true
        reload: true

    - name: Disable rp_filter (Required for asymmetric routing)
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.rp_filter
        value: '0'
        state: present
        sysctl_set: true
        reload: true

    - name: Deploy daemons config
      template:
        src: templates/daemons
        dest: /etc/frr/daemons
        owner: frr
        group: frr
        mode: '0640'
      notify: restart frr

    - name: Deploy frr.conf
      template:
        src: templates/frr.conf.j2
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
        mode: '0640'
      notify: restart frr

  handlers:
    - name: restart frr
      service:
        name: frr
        state: restarted
        enabled: true
