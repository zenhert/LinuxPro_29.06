---
- name: NGINX | Install and configure NGINX
  hosts: web
  become: true
  vars:
    nginx_listen_port: 8080

  tasks:
    - name: NGINX | Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
      tags:
        - nginx-install

    - name: NGINX | Create NGINX config file from template
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify:
        - restart nginx
      tags:
        - nginx-configuration

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes
